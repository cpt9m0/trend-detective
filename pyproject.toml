[project]
name = "trend-detective"
version = "0.1.0"
description = "Reusable NASA Earth system trend detection scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "earthaccess>=0.17.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "scipy>=1.17.1",
    "streamlit>=1.64.0",
    "xarray>=2026.7.0",
]

[project.scripts]
trend-detective = "trend_detective:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
